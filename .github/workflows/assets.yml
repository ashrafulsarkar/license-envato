name: Plugin asset/readme update
on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - 'readme.txt'
    - '.wordpress-org/**'
jobs:
  stable:
    name: Push to trunk
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # If the readme already points at a version that is not released on
    # WordPress.org yet (work in progress for the next release), keep the live
    # readme as-is so only the assets get updated. The new readme ships with
    # the release via deploy.yml.
    - name: Keep live readme while Stable tag is unreleased
      run: |
        SVN_URL="https://plugins.svn.wordpress.org/license-envato"
        TAG=$(grep -i -m1 '^Stable tag:' readme.txt | sed 's/^[^:]*: *//' | tr -d '\r ')
        echo "Stable tag in repo readme: $TAG"
        CODE=$(curl -s -o /dev/null -w '%{http_code}' "$SVN_URL/tags/$TAG/readme.txt")
        echo "tags/$TAG/readme.txt -> HTTP $CODE"
        if [ "$CODE" = "200" ]; then
          echo "Tag $TAG is released - readme will be updated."
        elif [ "$CODE" = "404" ]; then
          echo "Tag $TAG is not released yet - keeping the live readme, updating assets only."
          curl -fsSL "$SVN_URL/trunk/readme.txt" -o readme.txt
        else
          echo "::error::Could not determine whether tag $TAG is released (HTTP $CODE). Aborting so the live readme is not overwritten."
          exit 1
        fi
    - name: WordPress.org plugin asset/readme update
      uses: 10up/action-wordpress-plugin-asset-update@stable
      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SLUG: license-envato
